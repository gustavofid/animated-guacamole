services:

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8765:8765"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-estoque:
    image: postgres:16
    container_name: postgres-estoque
    environment:
      POSTGRES_DB: estoquedb
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoquedb"]
      interval: 10s
      timeout: 5s
      retries: 10

  servico-estoque:
    build: ./servico-estoque
    expose:
      - "8081"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-estoque:
        condition: service_healthy

  servico-pizzaria:
    build: ./ex5-pizzaria-clean-baseT1
    container_name: servico-pizzaria
    expose:
      - "8080"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servico-estoque:
        condition: service_started

  servico-entrega:
    build: ./servico-entrega
    expose:
      - "8082"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
