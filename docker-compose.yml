services:

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8765:8765"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

  servico-pizzaria:
    build: ./ex5-pizzaria-clean-baseT1
    container_name: servico-pizzaria
    # porta NÃO exposta ao host — apenas o gateway acessa internamente
    expose:
      - "8080"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
