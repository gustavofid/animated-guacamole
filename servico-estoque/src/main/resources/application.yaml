server:
  port: 8081

spring:
  application:
    name: servico-estoque
  datasource:
    url: jdbc:postgresql://postgres-estoque:5432/estoquedb
    username: estoque
    password: estoque123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true
